version: 2

# github-actions only. There is deliberately no `npm` entry.
#
# Dependabot regenerates pnpm-lock.yaml with its own resolver, which does not
# read pnpm-workspace.yaml — so it neither honours `minimumReleaseAge: 1440` nor
# keeps the four Shiki packages (shiki, @shikijs/langs, @shikijs/rehype,
# @shikijs/themes) on the single exact version they must share. A bot PR could
# therefore commit a lockfile that CI's own supply-chain verification pass then
# rejects, or one that resolves but splits the Shiki grammar/theme versions.
# `pnpm update` and `pnpm outdated`, run under this repo's own pnpm 11, are the
# correct updater for a single-package repo. Dependabot *alerts* need no config
# file, so vulnerability visibility is unaffected by leaving npm out.
#
# Actions are the opposite case: they are pinned to immutable commit SHAs in
# .github/workflows, nothing reports when a pin goes stale, and Dependabot
# rewrites both the SHA and its trailing `# vX.Y.Z` comment without touching a
# lockfile.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One PR for all three actions — they are bumped and reviewed together.
    groups:
      actions:
        patterns: ['*']
    # Same reasoning as minimumReleaseAge in pnpm-workspace.yaml: give a
    # compromised release time to be found and pulled. Stated explicitly rather
    # than inherited, so a change to Dependabot's default cannot quietly weaken
    # it.
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
